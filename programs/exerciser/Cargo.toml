# A Solana program that calls syscalls with arguments taken straight from its instruction data,
# so random tests can drive every syscall (and its address checks) against Agave.
[package]
name = "exerciser"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[profile.release]
overflow-checks = false
codegen-units = 1
lto = true
panic = "abort"

[workspace]

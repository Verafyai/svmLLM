# Ground truth for real programs: LiteSVM 0.18.2 (Agave 4.3.2 runtime, mainnet feature set).
# Runs one instruction of an ELF against given accounts; reports status, compute units, logs
# and every account's data afterwards. Versions pinned to match TinySVM's engine.
[package]
name = "svmtruth"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
litesvm = "=0.18.2"
solana-account = "=4.7.0"
solana-address = "=2.7.0"
solana-instruction = "=3.5.1"
solana-keypair = "=3.1.2"
solana-message = "=4.6.0"
solana-signer = "=3.0.1"
solana-transaction = "=4.3.0"
solana-compute-budget = "=4.3.2"
agave-feature-set = "=4.3.2"
solana-syscalls = "=4.3.2"
solana-program-runtime = "=4.3.2"
solana-sbpf = "=0.23.0"
serde_json = "=1.0.154"
sha2 = "=0.10.9"
hex = "=0.4.3"

[workspace]
